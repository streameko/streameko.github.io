<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error 404 – Streameko</title>
  <meta name="description" content="Página no encontrada en Streameko." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#e50914" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --accent: #e50914;
      --primary: #a78bfa;
      --glass: rgba(255, 255, 255, 0.05);
      --card: #1f1f1f;
      --glow-color: rgba(167, 139, 250, 0.4);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: sans-serif;
    }

    .stylish-topbar {
      background: rgba(10, 10, 15, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(to right, transparent, var(--accent), transparent) 1;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
    }

    .logo-container {
      transition: transform 0.3s ease;
    }

    .logo-container:hover {
      transform: scale(1.05);
    }

    .logo-text {
      transition: text-shadow 0.3s ease;
    }

    .logo-container:hover .logo-text {
      text-shadow: 0 0 10px var(--glow-color);
    }

    .nav-link-stylish {
      color: rgba(255, 255, 255, 0.8);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      z-index: 1;
    }

    .nav-link-stylish::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.4s ease;
      z-index: -1;
      border-radius: 8px;
    }

    .nav-link-stylish:hover {
      color: white;
      transform: translateY(-2px);
    }

    .nav-link-stylish:hover::before {
      opacity: 1;
      transform: scale(1);
    }

    .error-card {
      background: linear-gradient(
        135deg,
        rgba(167, 139, 250, 0.08),
        rgba(229, 9, 20, 0.08)
      );
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      transition: all 0.4s ease;
    }

    .error-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 40px rgba(229, 9, 20, 0.25);
      transform: translateY(-6px);
    }

    .home-btn {
      background: linear-gradient(135deg, #e50914, #b20710);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .home-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s ease;
    }

    .home-btn:hover::before {
      left: 100%;
    }

    .home-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 40px rgba(229, 9, 20, 0.6);
    }

    .is-mobile .logo-text {
      font-size: 1.25rem;
    }

    .is-mobile header nav {
      flex-direction: column;
      gap: 0.25rem;
      height: auto;
      padding: 0.5rem 0;
    }
  </style>
</head>

<body>

<header class="sticky top-0 z-50 w-full stylish-topbar">
  <div class="max-w-6xl mx-auto px-6">
    <nav class="flex items-center justify-between h-20">
      <a href="index.html" class="flex items-center gap-3 logo-container">
        <img src="favicon.ico" alt="Logo Streameko" class="h-9 w-9">
        <span class="text-2xl font-bold tracking-wider logo-text">STREAMEKO</span>
      </a>
      <div class="flex items-center gap-2 text-sm md:text-base font-semibold">
        <a href="index.html" class="nav-link-stylish">Inicio</a>
        <a href="contacto.html" class="nav-link-stylish">Contacto</a>
        <a href="donar.html" class="nav-link-stylish">Donar</a>
      </div>
    </nav>
  </div>
</header>

<main class="flex items-center justify-center min-h-[75vh] px-6 py-16">

  <div class="error-card rounded-2xl p-10 max-w-2xl w-full text-center">

    <h1 class="text-7xl md:text-8xl font-extrabold text-red-500 mb-6">
      404
    </h1>

    <h2 class="text-3xl font-bold mb-4 text-white">
      Esta historia no existe...
    </h2>

    <p class="text-white/70 text-lg mb-8">
      Parece que la página que buscabas se fue a otro universo.
      Puede que el enlace esté roto... o que haya sido víctima de un arco de relleno.
    </p>

    <div class="flex flex-col md:flex-row gap-4 justify-center">
      <a href="index.html"
         class="home-btn text-white font-bold py-3 px-8 rounded-full text-lg">
        Volver al inicio
      </a>
    </div>

  </div>

</main>

<footer class="py-8 text-center border-t border-white/10">
  <p class="text-white/50">© 2026 Streameko. ¡Para la comunidad!</p>
</footer>

<script>
  function detectarDispositivo() {
    const esMobile = /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);
    if (esMobile) {
      document.body.classList.add("is-mobile");
    }
  }
  detectarDispositivo();
</script>

</body>
</html>
