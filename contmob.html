<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 Internal Server Error</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: #e5e5e5;
      font-family: monospace;
    }

    #fake-500 {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
    }

    .error-box {
      max-width: 700px;
      width: 90%;
    }

    .error-title {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .error-desc {
      color: #a3a3a3;
      margin-bottom: 20px;
    }

    .error-footer {
      font-size: 13px;
      color: #737373;
    }

    hr {
      border-color: #333;
      margin: 20px 0;
    }
  </style>
</head>

<body>

<div id="fake-500">
  <div class="error-box">
    <h1 class="error-title">500 Internal Server Error</h1>

    <p class="error-desc">
      The server encountered an internal error and was unable to complete your request.
    </p>

    <hr>

    <p class="error-footer">
      nginx/1.25.3 (Ubuntu)
    </p>
  </div>
</div>

<script>
  console.error("Failed to load resource: the server responded with a status of 500");
</script>

</body>
</html>
