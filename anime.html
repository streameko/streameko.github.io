<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ver Animes – Streameko</title>  <meta name="description" content="Streameko es tu plataforma para ver anime gratis, subtitulado y doblado al español." />
  <meta name="keywords" content="anime, ver anime, anime gratis, anime subtitulado, anime doblado, anime online, streameko" />
  <meta name="author" content="Streameko" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#141414" />
  <link rel="canonical" href="https://streameko.github.io/" />  <meta property="og:title" content="Streameko – Ver Anime Gratis Subtitulado y Doblado" />
  <meta property="og:description" content="Disfruta anime online sin límites. Subtitulado y doblado al español en Streameko." />
  <meta property="og:url" content="https://streameko.github.io/" />
  <meta property="og:type" content="website" />  <script src="https://cdn.tailwindcss.com"></script>  <style>
    :root {
      --bg: #141414;
      --card: #1f1f1f;
      --text: #ffffff;
      --glass: rgba(255, 255, 255, 0.05);
      --primary: #e50914;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
    }

    .card {
      background: var(--card);
      border-radius: 0.5rem;
      transition: all 0.3s ease;
    }

    .glass {
      background: var(--glass);
      border-radius: 0.5rem;
      padding: 1rem;
      backdrop-filter: blur(8px);
    }

    .tab-button {
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-weight: 600;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loader-text {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.4;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }
  </style></head>
<body class="min-h-screen font-sans">
  <!-- Loader -->
  <div id="loader">
    <div class="loader-text">Cargando...</div>
  </div>  <!-- Modal NSFW -->  <div id="nsfwModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl p-6 max-w-md w-full text-center text-black relative shadow-xl">
      <h2 class="text-2xl font-bold mb-4">🫣 ¿Estás segur@?</h2>
      <p class="mb-6">
        Este anime está marcado como contenido para adultos.<br />
        Si decides continuar, Streameko no se hace responsable de tus actos 👀
      </p>
      <div class="flex justify-center gap-4">
        <button id="continueBtn" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded">
          Sí, quiero ver 🔥
        </button>
        <button id="exitBtn" class="bg-gray-300 hover:bg-gray-400 text-black font-semibold px-4 py-2 rounded">
          ¡Mejor no!
        </button>
      </div>
    </div>
  </div>  <!-- Contenido principal -->  <div class="max-w-4xl mx-auto p-6 main-content hidden">
    <a href="index.html" class="text-red-400 hover:underline text-sm">&larr; Volver al inicio</a>
    <div class="glass mt-4 mb-6 text-center">
      <h1 id="animeTitle" class="text-3xl font-bold mb-1"></h1>
      <p id="alternativeNames" class="text-sm text-white/60 mb-1"></p>
      <p id="episodeCount" class="text-white/80"></p>
    </div><div id="overviewContainer" class="glass mt-4 mb-6 shadow max-h-[10rem] overflow-hidden relative transition-all duration-300">
  <p id="animeOverview" class="text-white/80 text-sm whitespace-pre-line"></p>
  <div class="absolute bottom-2 right-4">
    <button id="toggleOverview" class="text-sm text-red-400 hover:underline hidden">Ver más</button>
  </div>
</div>

<div class="flex flex-wrap gap-2 mb-4 justify-center">
  <button id="tab-sub" class="tab-button bg-red-600 text-white">Subtitulado</button>
  <button id="tab-dub" class="tab-button bg-red-400 text-white/80">Doblado</button>
  <button id="tab-cas" class="tab-button bg-red-400 text-white/80">Castellano</button>
</div>

<div id="episodeListSub" class="space-y-4"></div>
<div id="episodeListDub" class="space-y-4 hidden"></div>
<div id="episodeListCas" class="space-y-4 hidden"></div>

  </div>  <!-- Modal de video -->  <div id="videoModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl p-4 max-w-3xl w-full relative">
      <button id="closeModal" class="absolute top-2 right-2 text-black font-bold text-xl">✖</button>
      <div id="modalContent" class="aspect-video w-full"></div>
    </div>
  </div>  <script>
    const params = new URLSearchParams(window.location.search);
    const animeId = params.get("id");

    const openModal = (embedUrl, episodeNum) => {
      localStorage.setItem(`ultimo_${animeId}`, episodeNum);
      document.getElementById("modalContent").innerHTML = `
        <iframe src="${embedUrl}" class="w-full h-full rounded" allowfullscreen></iframe>
      `;
      document.getElementById("videoModal").classList.remove("hidden");
    };

    document.getElementById("closeModal").addEventListener("click", () => {
      document.getElementById("videoModal").classList.add("hidden");
      document.getElementById("modalContent").innerHTML = "";
    });

    const setActiveTab = (tab) => {
      ["sub", "dub", "cas"].forEach(type => {
        const btn = document.getElementById(`tab-${type}`);
        const list = document.getElementById(`episodeList${type.charAt(0).toUpperCase() + type.slice(1)}`);
        if (btn && list) {
          if (type === tab) {
            btn.classList.replace("bg-red-400", "bg-red-600");
            btn.classList.replace("text-white/80", "text-white");
            list.classList.remove("hidden");
          } else {
            btn.classList.replace("bg-red-600", "bg-red-400");
            btn.classList.replace("text-white", "text-white/80");
            list.classList.add("hidden");
          }
        }
      });
    };

    fetch("animes_por_id.json")
      .then(res => res.json())
      .then(data => {
        const anime = data[animeId];
        if (!anime) {
          document.body.innerHTML = '<p class="text-center text-red-400 mt-10">Anime no encontrado.</p>';
          return;
        }

        if ("IsH" in anime && anime.IsH === true) {
          document.getElementById("nsfwModal").classList.remove("hidden");
          document.getElementById("continueBtn").onclick = () => {
            document.getElementById("nsfwModal").classList.add("hidden");
            mostrarContenido(anime);
            document.querySelector(".main-content").classList.remove("hidden");
          };
          document.getElementById("exitBtn").onclick = () => {
            window.location.href = "index.html";
          };
        } else {
          mostrarContenido(anime);
        }

        document.getElementById("loader").style.display = "none";
      });

    function mostrarContenido(anime) {
      document.getElementById("animeTitle").textContent = anime.name;
      const altNames = anime.alternative_names?.filter(n => n.trim()) || [];
      document.getElementById("alternativeNames").textContent = altNames.length ? `También conocido como: ${altNames.join(", ")}` : "";

      const episodiosSub = anime.episodes.filter(e => e.language === 0);
      const episodiosDub = anime.episodes.filter(e => e.language === 1);
      const episodiosCas = anime.episodes.filter(e => e.language === 2);

      const episodiosUnicos = new Set(anime.episodes.map(ep => ep.episode));
      document.getElementById("episodeCount").textContent = `${episodiosUnicos.size} episodio(s)`;

      const overviewElement = document.getElementById("animeOverview");
      const toggleButton = document.getElementById("toggleOverview");
      let overviewText = anime.overview?.trim() || "";

      if (!overviewText) {
        overviewElement.textContent = "Este anime no tiene sinopsis disponible.";
        toggleButton.classList.add("hidden");
      } else {
        overviewElement.textContent = overviewText;
        if (overviewText.length > 50) {
          toggleButton.classList.remove("hidden");
          let expanded = false;
          toggleButton.addEventListener("click", () => {
            expanded = !expanded;
            document.getElementById("overviewContainer").classList.toggle("max-h-[10rem]");
            document.getElementById("overviewContainer").classList.toggle("max-h-full");
            toggleButton.textContent = expanded ? "Ver menos" : "Ver más";
          });
        }
      }

      const renderEpisodios = (eps, id) => {
        const container = document.getElementById(id);
        const grouped = {};
        eps.forEach(ep => {
          if (!grouped[ep.episode]) grouped[ep.episode] = [];
          grouped[ep.episode].push(ep);
        });
        Object.keys(grouped).sort((a, b) => a - b).forEach(num => {
          const div = document.createElement("div");
          div.className = "card p-4";
          const buttons = grouped[num].map(v => `<button onclick="openModal('${v.url}', ${num})" class="bg-red-500 hover:bg-red-600 text-white rounded px-3 py-1 text-sm">Servidor ${v.server}</button>`).join(" ");
          div.innerHTML = `<p class="font-semibold text-white/90 mb-2">Episodio ${num}</p><div class="flex flex-wrap gap-2">${buttons}</div>`;
          container.appendChild(div);
        });
      };

      renderEpisodios(episodiosSub, "episodeListSub");
      renderEpisodios(episodiosDub, "episodeListDub");
      renderEpisodios(episodiosCas, "episodeListCas");

      if (!episodiosDub.length) document.getElementById("tab-dub").classList.add("hidden");
      if (!episodiosCas.length) document.getElementById("tab-cas").classList.add("hidden");

      const ultimo = localStorage.getItem(`ultimo_${animeId}`);
      if (ultimo) {
        const msg = document.createElement("p");
        msg.className = "text-sm text-green-400 mt-2 text-center";
        msg.textContent = `🌟 Último episodio visto: Episodio ${ultimo}`;
        document.querySelector(".glass").appendChild(msg);
      }

      document.querySelector('meta[property="og:title"]').setAttribute("content", `Ver ${anime.name} en Streameko`);
      document.querySelector('meta[property="og:description"]').setAttribute("content", anime.overview || "Disfruta de este anime en Streameko.");
      document.querySelector('meta[property="og:url"]').setAttribute("content", window.location.href);

      setActiveTab("sub");
      document.querySelector(".main-content").classList.remove("hidden");
    }

    ["sub", "dub", "cas"].forEach(type => {
      document.getElementById(`tab-${type}`)?.addEventListener("click", () => setActiveTab(type));
    });
  </script></body>
</html>
