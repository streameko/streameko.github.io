  <!DOCTYPE html>

    <script>
    try {
      const animeJSON = localStorage.getItem("selectedAnime");
      if (animeJSON) {
        const anime = JSON.parse(animeJSON);
        document.title = `Ver ${anime.name} – Streameko`;
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute("content", `Ver ${anime.name} en Streameko`);
        const ogDescription = document.querySelector('meta[property="og:description"]');
        if (ogDescription) ogDescription.setAttribute("content", anime.overview || `Disfruta de todos los episodios de ${anime.name}.`);
      }
    } catch (error) {
      console.error("Error al actualizar la informacion para el navegador:", error);
      document.title = "Streameko Fallback Page";
    }
  </script>

    <style>
  @keyframes modalIn {
    0% {
      opacity: 0;
      transform: scale(0.85) translateY(30px);
    }
    100% {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
  @keyframes modalOut {
    0% {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    100% {
      opacity: 0;
      transform: scale(0.85) translateY(30px);
    }

  .modal-anim {
    animation-duration: 0.35s;
    animation-fill-mode: forwards;
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
  }

  .modal-entering {

  .logo-container {

  .nav-link-stylish {

  }
  .nav-link-stylish::before {
    content: '';
    position: absolute;
    top: 0; 
    left: 0;
    width: 100%; 
    height: 100%;
    background: var(--accent);
    opacity: 0; 
    transform: scale(0.8);
    transition: all 0.4s ease;

  .nav-link-stylish:hover {

  <script>
    function detectarDispositivo() {
      const esMobile = /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent) || 
                      window.matchMedia("(max-width: 768px)").matches;
      if (esMobile) {
        document.body.classList.add("is-mobile");
      } else {
        document.body.classList.remove("is-mobile");
      }
    }
    
    detectarDispositivo();
    window.addEventListener("resize", detectarDispositivo);

    function isMobile() {
      return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent) 
            || window.matchMedia("(max-width: 768px)").matches;
    }

      const params = new URLSearchParams(window.location.search);
      const animeId = params.get("id");

      const serverDisplayNames = { "Gamma": "Tokio", "Delta": "Nara", "Alpha": "Osaka", "Epsilon": "Kioto" };
      const serverBaseUrls = { "Gamma": "https://jilliandescribecompany.com/e/", "Alpha": "https://dumbalag.com/e/", "Delta": "https://filemoon.nl/e/", "Epsilon": "https://luluvdoo.com/e/" };

      const videoModal = document.getElementById("videoModal");
      const modalContent = document.getElementById("modalContent");
      const modalBox = document.getElementById("modalBox");

      let modalAnimationInProgress = false;


  function openModal(baseUrl, path, episodeNum) {
    if (modalAnimationInProgress) return;
    
    localStorage.setItem(`ultimo_${animeId}`, episodeNum);

    const targetUrl = baseUrl + path;
    console.log("Cargando episodio desde:", targetUrl);

    try {
      modalContent.innerHTML = `
        <iframe 
          src="${targetUrl}" 
          class="w-full h-full" 
          style="border:none;"
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      `;
      
      modalAnimationInProgress = true;
      videoModal.classList.remove("hidden");
      videoModal.classList.add("bg-entering");
      
      modalBox.classList.remove("modal-anim", "modal-entering", "modal-leaving");
      modalBox.classList.add("modal-anim", "modal-entering");

      const handleEnterEnd = () => {
        modalBox.removeEventListener("animationend", handleEnterEnd);
        modalAnimationInProgress = false;
        videoModal.classList.remove("bg-entering");
        modalBox.classList.remove("modal-entering");
      };

      modalBox.addEventListener("animationend", handleEnterEnd);

    } catch (err) {
      console.error("Error cargando video:", err);
      modalContent.innerHTML = `<p class="text-red-500 p-4">Error cargando el episodio. Por favor reportalo</p>`;
      videoModal.classList.remove("hidden");
      modalAnimationInProgress = false;
    }
  }

  function closeModal() {
    if (modalAnimationInProgress) return;

    modalAnimationInProgress = true;
    
    videoModal.classList.add("bg-leaving");
    modalBox.classList.remove("modal-entering");
    modalBox.classList.add("modal-leaving");

    const handleExitEnd = (e) => {
      if (e.target === modalBox && e.animationName === "modalOut") {
        modalBox.removeEventListener("animationend", handleExitEnd);
        
        videoModal.classList.add("hidden");
        videoModal.classList.remove("bg-leaving");
        modalBox.classList.remove("modal-anim", "modal-leaving");
        modalContent.innerHTML = "";
        modalAnimationInProgress = false;
      }
    };

    modalBox.addEventListener("animationend", handleExitEnd);
  }

  document.getElementById("closeModal").addEventListener("click", closeModal);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !videoModal.classList.contains("hidden")) {
      closeModal();
    }
  });

  videoModal.addEventListener("click", (e) => {
    if (e.target === videoModal) {
      closeModal();
    }
  });

      function setActiveTab(tab) {
          ["sub", "dub", "cas"].forEach(type => {
              const btn = document.getElementById(`tab-${type}`);
              const list = document.getElementById(`episodeList${type.charAt(0).toUpperCase() + type.slice(1)}`);
              if (btn && list) {
                  const isActive = type === tab;
                  btn.classList.toggle("bg-red-600", isActive);
                  btn.classList.toggle("text-white", isActive);
                  btn.classList.toggle("bg-red-400", !isActive);
                  btn.classList.toggle("text-white/80", !isActive);
                  list.classList.toggle("hidden", !isActive);
              }
          });
      }

  async function loadAnimeData() {
      if (!animeId) { 
          document.body.innerHTML = '<p class="text-center text-red-400 mt-10">Error 404: Anime no encontrado. Por favor reportalo</p>'; 
          return; 
      }

      try {
          const SQL = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}` });

          const zipUrl = "https://raw.githubusercontent.com/streameko/streameko.github.io/main/anime.zip";
          const response = await fetch(zipUrl);
          const arrayBuffer = await response.arrayBuffer();
          const zipData = new Uint8Array(arrayBuffer);

          let db;
          fflate.unzip(zipData, (err, files) => {
              if (err) throw err;
              const dbFile = files["anime.db"];
              if (!dbFile) throw new Error("anime.db no encontrado en el zip");
              db = new SQL.Database(dbFile);
              mostrarAnimeDesdeDB(db);
          });
      } catch (error) {
          console.error("Falló la carga desde ZIP:", error);
          document.body.innerHTML = `<p class="text-center text-red-500 mt-10">Oops! Hubo un error al cargar: ${error.message}</p>`;
      }
  }
  function mostrarAnimeDesdeDB(db) {
      const animeRes = db.exec("SELECT name, name_alternative, overview, genres FROM animes WHERE id = :id", {':id': animeId});
      if (!animeRes.length || !animeRes[0].values.length) { 
          document.body.innerHTML = '<p class="text-center text-red-400 mt-10">Error 404: Anime no encontrado</p>'; 
          return; 
      }
      const [name, name_alternative, overview, genres] = animeRes[0].values[0]
      const anime = { name, name_alternative, overview, genres };

      const isNsfw = anime.genres && anime.genres.toLowerCase().includes("soft-hentai");
      if (isNsfw) {
          document.getElementById("nsfwModal").classList.remove("hidden");
          document.getElementById("continueBtn").onclick = () => { 
              document.getElementById("nsfwModal").classList.add("hidden"); 
              mostrarContenido(anime, db); 
          };
          document.getElementById("exitBtn").onclick = () => { window.location.href = "index.html"; };
      } else {
          mostrarContenido(anime, db);
      }
  }

      function mostrarContenido(anime, db) {
          document.getElementById("animeTitle").textContent = anime.name;
          document.getElementById("alternativeNames").textContent = anime.name_alternative ? `También como: ${anime.name_alternative.replace(/,/g, ', ')}` : "";
          
          const overviewElement = document.getElementById("animeOverview");
          const toggleButton = document.getElementById("toggleOverview");
          let overviewText = anime.overview?.trim() || "Sinopsis no disponible.";
          overviewElement.textContent = overviewText;
          setTimeout(() => {
              if (overviewElement.scrollHeight > overviewElement.clientHeight) {
                  toggleButton.classList.remove("hidden");
                  let expanded = false;
                  toggleButton.addEventListener("click", () => {
                      expanded = !expanded;
                      overviewElement.classList.toggle("line-clamp-3");
                      toggleButton.textContent = expanded ? "Ver menos" : "Ver más";
                      document.getElementById("overviewContainer").style.overflow = expanded ? "visible" : "hidden";
                  });
              }
          }, 100);
          
          const episodesQuery = `SELECT e.number, p.language, p.link, s.name as server_name FROM episodes AS e JOIN players AS p ON e.id = p.episode_id JOIN servers AS s ON p.server_id = s.id WHERE e.anime_id = :id ORDER BY p.language, CAST(e.number AS REAL)`;
          const episodesRes = db.exec(episodesQuery, {':id': animeId});
          const episodes = episodesRes.length ? episodesRes[0].values.map(([number, language, link, server]) => ({number, language, link, server})) : [];
          
          const episodiosUnicos = new Set(episodes.map(ep => ep.number));
          document.getElementById("episodeCount").textContent = `${episodiosUnicos.size} episodio(s)`;

          const episodiosSub = episodes.filter(e => e.language === 0);
          const episodiosDub = episodes.filter(e => e.language === 1);
          const episodiosCas = episodes.filter(e => e.language === 2);

          renderEpisodios(episodiosSub, "episodeListSub");
          renderEpisodios(episodiosDub, "episodeListDub");
          renderEpisodios(episodiosCas, "episodeListCas");

          if (!episodiosDub.length) document.getElementById("tab-dub").classList.add("hidden");
          if (!episodiosCas.length) document.getElementById("tab-cas").classList.add("hidden");

          const ultimo = localStorage.getItem(`ultimo_${animeId}`);
          if (ultimo) {
              const msg = document.createElement("p");
              msg.className = "text-sm text-green-400 mt-2 text-center";
              msg.textContent = `🌟 Último episodio visto: Episodio ${ultimo}`;
              document.getElementById("animeHeader").appendChild(msg);
          }

          setActiveTab("sub");
          document.getElementById("loader").remove();
          document.querySelector(".main-content").classList.remove("hidden");
      }

      function renderEpisodios(eps, containerId) {
          const serverAds = {
            "Gamma": "👍👎",
            "Alpha": "👎",
            "Delta": "👍👎",
            "Epsilon": "👎"
          };

          const container = document.getElementById(containerId);
          container.innerHTML = '';
          const grouped = {};
          eps.forEach(ep => {
              if (!grouped[ep.number]) grouped[ep.number] = [];
              grouped[ep.number].push(ep);
          });

          Object.keys(grouped).sort((a, b) => Number(a) - Number(b)).forEach(num => {
              const div = document.createElement("div");
              div.className = "card p-4 h-full flex flex-col justify-between";
              const buttons = grouped[num].map(v => {
                  const displayName = serverDisplayNames[v.server] || v.server;
                  const baseUrl = serverBaseUrls[v.server] || "";
                  return `<button onclick="openModal('${baseUrl}', '${v.link}', ${num})" 
                class="bg-red-500 hover:bg-red-600 text-white rounded px-3 py-1 text-sm flex items-center justify-center gap-1">
            ${displayName} <span class="text-xs">${serverAds[v.server] || ""}</span>
          </button>`;
              }).join(" ");
              div.innerHTML = `<p class="font-semibold text-white/90 mb-2">Episodio ${num}</p><div class="flex flex-wrap gap-2">${buttons}</div>`;
              container.appendChild(div);
          });
      }

      ["sub", "dub", "cas"].forEach(type => {
          const tab = document.getElementById(`tab-${type}`);
          if (tab) tab.addEventListener("click", () => setActiveTab(type));
      });

      loadAnimeData();
  </script>
  </body>
