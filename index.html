 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inicio – Streameko Retro</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #000;
      color: #39ff14; /* verde neón fosforescente */
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.5;
      padding: 1rem;
    }
    h1, h2 {
      text-shadow:
        0 0 5px #39ff14,
        0 0 10px #39ff14,
        0 0 20px #39ff14;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .warning {
      border: 2px dashed #39ff14;
      padding: 1rem;
      margin-bottom: 2rem;
      text-align: center;
      background-color: rgba(57, 255, 20, 0.05);
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.1em;
      box-shadow:
        0 0 10px #39ff14,
        inset 0 0 5px #39ff14;
    }
    .notice {
      margin-top: 0.5rem;
      font-style: italic;
      color: #6fef6f;
    }
    input[type="text"] {
      width: 100%;
      max-width: 400px;
      padding: 0.5rem;
      font-family: monospace;
      font-size: 1rem;
      color: #39ff14;
      background-color: #000;
      border: 2px solid #39ff14;
      outline: none;
      margin-bottom: 1rem;
      box-shadow:
        0 0 5px #39ff14;
    }
    input[type="text"]::placeholder {
      color: #39ff1466;
    }
    label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #39ff14;
    }
    button {
      background-color: transparent;
      color: #39ff14;
      border: 2px solid #39ff14;
      padding: 0.4rem 1rem;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 1rem;
      box-shadow:
        0 0 8px #39ff14;
    }
    button:hover {
      background-color: #39ff14;
      color: #000;
      box-shadow:
        0 0 12px #39ff14;
    }
    #animeList {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }
    .card {
      border: 2px dotted #39ff14;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #001a00;
      box-shadow:
        0 0 10px #39ff14 inset;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow:
        0 0 20px #39ff14 inset;
    }
    .card img {
      max-width: 180px;
      height: 240px;
      object-fit: cover;
      border: 1px solid #39ff14;
      margin-bottom: 0.5rem;
      box-shadow:
        0 0 8px #39ff14;
    }
    .card h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.2rem;
      text-align: center;
      text-shadow: 0 0 5px #39ff14;
    }
    .card button {
      margin-top: auto;
      padding: 0.3rem 0.8rem;
      font-size: 0.9rem;
    }
    .reciente {
      color: #aaffaa;
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
      text-align: center;
      text-shadow: 0 0 4px #aaffaa;
    }
    #loader {
      text-align: center;
      margin-top: 3rem;
      font-weight: bold;
      font-size: 1.25rem;
      text-shadow:
        0 0 10px #39ff14;
    }
  </style>
</head>
<body>

  <h1>Streameko - Beta</h1>

  <div class="warning">
    ⚠️ ESTILO RETRO ACTIVADO ⚠️<br />
    Esto es solo una broma visual, no olvides volver a la modernidad cuando quieras.
    <div class="notice">– El equipo de Streameko</div>
  </div>

  <input type="text" id="searchInput" placeholder="Buscar anime..." autocomplete="off" />

  <label for="dubToggle">
    <input type="checkbox" id="dubToggle" />
    Solo Doblados
  </label>

  <button onclick="limpiarRecientes()">🧹 Limpiar Recientes</button>

  <div id="loader">Cargando animes...</div>

  <div id="animeList"></div>

  <script>
    let animeData = {};

    fetch("animes_por_id.json")
      .then(res => res.json())
      .then(data => {
        animeData = data;
        document.getElementById("loader").style.display = "none";
        renderAnimeList();
      });

    const searchInput = document.getElementById("searchInput");
    const dubToggle = document.getElementById("dubToggle");
    const animeList = document.getElementById("animeList");

    searchInput.addEventListener("input", renderAnimeList);
    dubToggle.addEventListener("change", renderAnimeList);

    function crearCardAnime(anime, id, extraEtiqueta = "") {
      const poster = anime.poster || "poster_default.png";
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        ${extraEtiqueta}
        <img src="${poster}" alt="Póster de ${anime.name}" />
        <h2>${anime.name}</h2>
        <button onclick="viewAnime('${id}')">Ver Episodios</button>
      `;
      return div;
    }

    function renderAnimeList() {
      const query = searchInput.value.toLowerCase();
      const dubbedOnly = dubToggle.checked;
      animeList.innerHTML = "";

      const recientes = JSON.parse(localStorage.getItem("recientes")) || [];
      recientes.forEach(id => {
        const anime = animeData[id];
        if (!anime) return;
        const etiqueta = `<p class="reciente">🕒 Recientemente visto</p>`;
        animeList.appendChild(crearCardAnime(anime, id, etiqueta));
      });

      Object.entries(animeData).forEach(([id, anime]) => {
        if (recientes.includes(id)) return;

        const names = [anime.name, ...(anime.alternative_names || [])].map(n => n.toLowerCase());
        if (!names.some(name => name.includes(query))) return;

        const hasDub = (anime.episodes || []).some(ep => ep.language === 1);
        if (dubbedOnly && !hasDub) return;

        animeList.appendChild(crearCardAnime(anime, id));
      });
    }

    function viewAnime(id) {
      localStorage.setItem("selectedAnime", JSON.stringify(animeData[id]));
      const recientes = JSON.parse(localStorage.getItem("recientes")) || [];
      const idx = recientes.indexOf(id);
      if (idx !== -1) recientes.splice(idx, 1);
      recientes.unshift(id);
      if (recientes.length > 6) recientes.pop();
      localStorage.setItem("recientes", JSON.stringify(recientes));
      window.location.href = `anime.html?id=${id}`;
    }

    function limpiarRecientes() {
      localStorage.removeItem("recientes");
      renderAnimeList();
    }
  </script>
</body>
</html>
