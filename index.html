  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --accent: #e50914;
      --primary: #a78bfa;
      --glass: rgba(255, 255, 255, 0.05);
      --card: #1f1f1f;
      --glow-color: rgba(167, 139, 250, 0.4);
    }
    html { scroll-behavior: smooth; }
    body { background-color: var(--bg); color: var(--text); font-family: sans-serif; }
    
    .stylish-topbar { 
      background: rgba(10, 10, 15, 0.6); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px); 
      border-bottom: 1px solid transparent; 
      border-image: linear-gradient(to right, transparent, var(--accent), transparent) 1; 
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4); 
    }
    .logo-container { transition: transform 0.3s ease; }
    .logo-container:hover { transform: scale(1.05); }
    .logo-text { transition: text-shadow 0.3s ease; }
    .logo-container:hover .logo-text { text-shadow: 0 0 10px var(--glow-color, var(--primary)); }
    .nav-link-stylish { color: rgba(255, 255, 255, 0.8); padding: 0.5rem 1rem; border-radius: 8px; position: relative; overflow: hidden; transition: all 0.3s ease; z-index: 1; }
    .nav-link-stylish::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--accent); opacity: 0; transform: scale(0.8); transition: all 0.4s ease; z-index: -1; border-radius: 8px; }
    .nav-link-stylish:hover { color: white; transform: translateY(-2px); }
    .nav-link-stylish:hover::before { opacity: 1; transform: scale(1); }

    .is-mobile header nav {
      flex-direction: column;
      gap: 0.25rem;
      height: auto;
      padding: 0.5rem 0;
    }
    .is-mobile header nav > div {
      gap: 0.25rem;
    }
    .is-mobile .logo-text {
      font-size: 1.25rem;

  <script>
    function detectarDispositivo() {
      const esMobile = /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);
      if (esMobile) {
        document.body.classList.add("is-mobile");
      }
    }
    detectarDispositivo();
